    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const overlay = document.getElementById('portfolio-first-visit')
        if (!overlay) return
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        const duration = 2600
        const startedAt = performance.now()
        let pageLoaded = document.readyState === 'complete'
        let progressComplete = false
        let dismissed = false
        let progressTimer

        const percent = overlay.querySelector('.portfolio-intro-percent')

        const finish = (force = false) => {
          if (dismissed) return
          dismissed = true
          window.clearInterval(progressTimer)
          overlay.classList.add('is-hidden')
          if (force || reducedMotion) {
            window.setTimeout(() => {
              overlay.hidden = true
              document.documentElement.classList.remove('show-portfolio-intro')
            }, force ? 0 : 400)
            return
          }
          window.setTimeout(() => {
            overlay.hidden = true
            document.documentElement.classList.remove('show-portfolio-intro')
          }, 400)
        }

        const dismissWhenReady = () => {
          if (pageLoaded && progressComplete) finish()
        }

        const updateProgress = () => {
          const elapsed = performance.now() - startedAt
          if (!reducedMotion) percent.textContent = `${Math.min(100, Math.floor((elapsed / duration) * 100))}%`
          if (elapsed >= duration) {
            progressComplete = true
            percent.textContent = '100%'
            window.clearInterval(progressTimer)
            dismissWhenReady()
          }
        }

        overlay.addEventListener('click', () => finish())
        overlay.querySelector('.portfolio-intro-skip').addEventListener('click', (event) => {
          event.stopPropagation()
          finish()
        })

        window.addEventListener('load', () => {
          pageLoaded = true
          dismissWhenReady()
        }, { once: true })

        if (reducedMotion) {
          overlay.classList.add('motion-reduced')
          percent.textContent = '100%'
        }

        progressTimer = window.setInterval(updateProgress, 40)
        updateProgress()

        window.setTimeout(() => finish(true), 4000)
        dismissWhenReady()
      })()
    </script>
  </body>
</html>
